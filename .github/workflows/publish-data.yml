name: Publish static market data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: publish-static-market-data
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect market data
        run: python scripts/collect_market_data.py --output public

      - name: Collect disclosure events
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/collect_disclosures.py --output public

      - name: Validate dataset
        run: python scripts/validate_dataset.py public --min-success-per-market 1

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: scripts/publish_gh_pages.sh public
