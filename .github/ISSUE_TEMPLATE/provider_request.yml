name: Provider or market request
description: Suggest a provider, market, interval, or symbol-universe change.
title: "Provider request: "
labels: ["enhancement", "provider"]
body:
  - type: textarea
    id: request
    attributes:
      label: Request
      description: What provider, market, interval, or symbol set should be added?
    validations:
      required: true
  - type: textarea
    id: terms
    attributes:
      label: Terms and redistribution notes
      description: Summarize source terms, redistribution rights, API limits, and authentication requirements.
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Implementation notes
      description: Link documentation or describe the expected data shape.
    validations:
      required: false
